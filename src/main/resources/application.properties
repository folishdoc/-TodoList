spring.application.name=todolist

# Server Configuration（桌面版固定端口）
server.port=18080

# Database Configuration — H2 嵌入式数据库
spring.datasource.url=jdbc:h2:file:./data/todolist_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console — 生产环境关闭（开发环境在 application-dev.properties 中开启）
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.liuzeyu.todolist.module.task.entity,com.liuzeyu.todolist.module.list.entity,com.liuzeyu.todolist.module.tag.entity,com.liuzeyu.todolist.module.habit.entity,com.liuzeyu.todolist.module.anniversary.entity,com.liuzeyu.todolist.module.auth.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30

# PageHelper
pagehelper.helper-dialect=h2
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=./uploads

# JWT Configuration
# 优先读环境变量，没有则回退到开发默认值
app.jwt.secret=${JWT_SECRET:dev-jwt-secret-key-for-todolist-app-2026-hmac-sha256}
app.jwt.expiration=3153600000000

# Personal Auth Token（留空 = 禁用，强制走 JWT 登录）
app.personal.token=${PERSONAL_TOKEN:}

# AI 智能任务录入（默认 DeepSeek，OpenAI 兼容接口）
langchain4j.open-ai.chat-model.base-url=${AI_BASE_URL:https://api.deepseek.com/v1}
langchain4j.open-ai.chat-model.api-key=${AI_API_KEY:sk-placeholder}
langchain4j.open-ai.chat-model.model-name=${AI_MODEL_NAME:deepseek-chat}
langchain4j.open-ai.chat-model.temperature=0.1
langchain4j.open-ai.chat-model.timeout=60000
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false

