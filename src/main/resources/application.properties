spring.application.name=todolist

# Server Configuration（桌面版固定端口）
server.port=18080

# Database Configuration — H2 嵌入式数据库
spring.datasource.url=jdbc:h2:file:./data/todolist_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console（开发调试用，打包后可设为 false）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration
# 注意：生产环境请使用环境变量 JWT_SECRET
app.jwt.secret=${JWT_SECRET:ioBwFlexsSHhbvE54VcT5gyx8pxFn8wYxB2Y2xRJZcgAEB3cjVRpU+KDqEQxhpMgk1MYL1KByw5z5sDJyZtX2g==}
app.jwt.expiration=86400000

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=./uploads

# Personal Use Token (开发环境使用，生产环境请删除)
# 注意：这个token仅用于个人本地开发，部署到公网前必须删除此配置
app.personal.token=${PERSONAL_TOKEN:dev-personal-token-2026-secure-key}
