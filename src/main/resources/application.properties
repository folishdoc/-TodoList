spring.application.name=todolist

# Server Configuration
server.port=8080

# Database Configuration
# 注意：生产环境请使用环境变量 DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/todolist_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:asd13698}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# 注意：生产环境请使用环境变量 JWT_SECRET
app.jwt.secret=${JWT_SECRET:ioBwFlexsSHhbvE54VcT5gyx8pxFn8wYxB2Y2xRJZcgAEB3cjVRpU+KDqEQxhpMgk1MYL1KByw5z5sDJyZtX2g==}
app.jwt.expiration=86400000

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=uploads

# Personal Use Token (开发环境使用，生产环境请删除)
# 注意：这个token仅用于个人本地开发，部署到公网前必须删除此配置
app.personal.token=${PERSONAL_TOKEN:dev-personal-token-2026-secure-key}
