# ============================================================
# 开发环境配置 — 使用 `--spring.profiles.active=dev` 激活
# ============================================================

# H2 Console（开发调试用）
spring.h2.console.enabled=true

# MyBatis SQL 日志（mapper 接口全限定名作为 logger，debug 级别输出执行的 SQL + 参数）
logging.level.com.liuzeyu.todolist.module.task.mapper=debug
logging.level.com.liuzeyu.todolist.module.list.mapper=debug
logging.level.com.liuzeyu.todolist.module.tag.mapper=debug
logging.level.com.liuzeyu.todolist.module.habit.mapper=debug
logging.level.com.liuzeyu.todolist.module.anniversary.mapper=debug
logging.level.com.liuzeyu.todolist.module.auth.mapper=debug
