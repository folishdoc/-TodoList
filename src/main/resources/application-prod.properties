# Server
server.port=8080

# Database - MySQL 8.0 (configure via env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/todolist?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Redis - 缓存/会话/限流（仅生产环境）
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=0

# Swagger - disable in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
