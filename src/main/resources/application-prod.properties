# Server
server.port=8080

# Database — MySQL 8.0 (configure via env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/todolist?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 Console — disabled in production
spring.h2.console.enabled=false

# Swagger — disable in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# CORS — restrict to your domain
app.cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}
