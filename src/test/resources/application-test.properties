spring.application.name=todolist-test

# Test profile — use H2 内存库
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# File Upload — 使用临时目录
file.upload.dir=${java.io.tmpdir}/todolist-test-uploads

# H2 Console（测试时禁用）
spring.h2.console.enabled=false

# 禁用 Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 禁用定时任务调度（避免测试中触发）
spring.task.scheduling.pool.size=0
spring.task.scheduling.thread-name-prefix=scheduling-test-

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson 3 default already serializes dates as ISO-8601 strings
# (no write-dates-as-timestamps config needed)
