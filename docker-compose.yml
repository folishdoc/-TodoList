services:
  mysql:
    image: mysql:8.0
    container_name: todolist-mysql
    restart: unless-stopped
    volumes:
      - mysql-data-v2:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: todolist
      MYSQL_USER: todolist
      MYSQL_PASSWORD: app123
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: eclipse-temurin:17-jre-alpine
    container_name: todolist-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    command: java -jar /app/app.jar
    expose:
      - "18080"
    volumes:
      - ./app.jar:/app/app.jar:ro
      - uploads:/app/uploads
    environment:
      JWT_SECRET: 3BQ+wiGD6avC/Mn4ZFkCSgDaJIspJkQ57Sc7NjpXqx/ueMMJR3hp4owpwVHEp5RPv5p25jXkKrwOXE4t0FxPqw==
      PERSONAL_TOKEN: 78340008c58fc2449bae8f5f1d7703634727f8dd264764165b2d17388e1c4e74
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/todolist?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: todolist
      SPRING_DATASOURCE_PASSWORD: app123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      PAGEHELPER_HELPER_DIALECT: mysql
      FILE_UPLOAD_DIR: /app/uploads
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 20MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 20MB

  frontend:
    image: nginx:alpine
    container_name: todolist-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql-data-v2:
  uploads:
