<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todolist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; flex-direction: column; height: 100vh;
            background: #f5f7fa; font-family: 'Microsoft YaHei', sans-serif;
        }
        .bootstrap-titlebar {
            height: 32px; background: #1a1a2e;
            display: flex; align-items: center; flex-shrink: 0;
            padding-left: 14px; color: #e0e0e0; font-size: 13px; font-weight: 500;
            user-select: none; -webkit-app-region: drag;
        }
        .loader-wrapper {
            flex: 1; display: flex; align-items: center; justify-content: center;
        }
        .loader { text-align: center; color: #606266; }
        .loader h2 { margin-bottom: 16px; color: #667eea; }
        .loader p { font-size: 14px; }
        .loader .dot { animation: blink 1.4s infinite both; }
        .loader .dot:nth-child(2) { animation-delay: 0.2s; }
        .loader .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="bootstrap-titlebar">📝 Todolist</div>
    <div class="loader-wrapper">
        <div class="loader">
            <h2>Todolist</h2>
            <p>正在启动服务<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
            <p id="error-msg" style="display:none; color: #f56c6c; margin-top: 12px;"></p>
        </div>
    </div>
    <script src="loader.js"></script>
</body>
</html>
