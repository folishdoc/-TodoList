<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todolist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; background: #f5f7fa; font-family: 'Microsoft YaHei', sans-serif;
        }
        .loader { text-align: center; color: #606266; }
        .loader h2 { margin-bottom: 16px; color: #667eea; }
        .loader p { font-size: 14px; }
        .loader .dot { animation: blink 1.4s infinite both; }
        .loader .dot:nth-child(2) { animation-delay: 0.2s; }
        .loader .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="loader">
        <h2>Todolist</h2>
        <p>正在启动服务<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
    </div>
    <script>
        // 轮询后端直到就绪，然后跳转
        async function check() {
            try {
                const r = await fetch('http://localhost:18080/api/tasks');
                if (r.ok) { window.location.href = 'http://localhost:18080'; return; }
            } catch(e) {}
            setTimeout(check, 1000);
        }
        check();
    </script>
</body>
</html>
